<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>赛博礼堂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: full-screen 3D hall; glass HUD pinned top, actions pinned bottom; single night-temple look */
:root{
  --ink:#100d0b; --lacquer:#4b1d16; --gold:#d9b46c; --gold-dim:#a8854a;
  --paper:#f1e8d6; --jade:#6f8c7c;
  --glass:rgba(22,17,13,.66); --line:rgba(217,180,108,.28);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--sans)}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#c{display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.hud>*{pointer-events:auto}
.pill{display:flex;align-items:center;border-radius:999px;height:44px;padding:0 4px}
.pill>*{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%}
.pill>*+*{border-left:1px solid var(--line)}
.hall{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--gold)}
.count{font-size:13px;color:rgba(241,232,214,.8);font-variant-numeric:tabular-nums}
.wealth-top b{font-family:var(--serif);color:var(--gold);font-size:16px;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:right}
.wealth-top span{font-size:12px;opacity:.75}
.icon-btn{width:44px;justify-content:center;padding:0!important}
.icon-btn svg{width:20px;height:20px;stroke:var(--paper);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.view{font-size:13px;border-radius:999px;height:36px;padding:0 14px}
.view b{color:var(--gold);font-weight:500;margin-left:4px}

#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;display:flex;align-items:center;gap:5px;
  background:rgba(241,232,214,.86);color:#2a1d14;font-size:12px;border-radius:999px;padding:3px 9px 3px 3px;will-change:transform}
.tag i{font-style:normal;width:19px;height:19px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;font-size:11px}
.tag.npc{background:rgba(16,13,11,.55);color:rgba(241,232,214,.85);padding:2px 8px;font-size:11px}

#toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 32px);
  text-align:center;font-size:14px;padding:10px 18px;border-radius:999px;transition:opacity .35s;opacity:0;pointer-events:none}
#toast.show{opacity:1}

.actions{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;
  padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.actions>*{pointer-events:auto}
.big-btn{height:54px;min-width:150px;padding:0 28px;border-radius:999px;font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.3em;text-indent:.3em;
  background:linear-gradient(180deg,#e5c584,#b98d45);color:#24170c;box-shadow:0 8px 30px rgba(217,180,108,.35)}

#muyuPanel{position:absolute;right:0;bottom:0;width:min(210px,50vw);
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center}
.wealth{display:flex;align-items:baseline;gap:10px;font-family:var(--serif)}
.wealth span{font-size:15px;color:rgba(241,232,214,.75);letter-spacing:.2em}
.wealth b{font-size:44px;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(217,180,108,.45);transition:transform .12s}
.wealth b.pop{transform:scale(1.12)}
#muyu{width:100%;height:auto;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6));user-select:none}
.under{display:flex;flex-direction:column;align-items:center;width:100%;gap:6px;margin-top:2px}
.under .hint{font-size:12px;color:rgba(241,232,214,.65)}
.ghost{height:40px;padding:0 18px;border-radius:999px;font-size:14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;margin-bottom:8px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{height:32px;padding:0 16px;border-radius:999px;font-size:13px;color:rgba(241,232,214,.72)}
.seg button.on{background:var(--gold);color:#24170c;font-weight:500}
#beadsBox{width:100%;display:flex;flex-direction:column;align-items:center}
.bcount{display:flex;align-items:baseline;gap:6px;font-family:var(--serif);color:var(--paper);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.bcount b{font-size:30px;color:var(--gold);font-variant-numeric:tabular-nums}
.bcount span{font-size:13px;opacity:.75}
.bcount small{font-size:12px;opacity:.75;margin-left:4px}
#beads{width:100%;height:min(340px,44vh);touch-action:none;cursor:grab;display:block}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.float{position:absolute;left:0;top:0;font-family:var(--serif);font-weight:700;color:var(--gold);font-size:20px;white-space:nowrap;
  background:rgba(16,13,11,.72);border:1px solid var(--line);border-radius:999px;padding:3px 12px;text-shadow:0 1px 6px rgba(0,0,0,.6);will-change:transform,opacity}

#intro{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(75,29,22,.55),rgba(16,13,11,.88) 70%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.card{width:min(360px,100%);border-radius:24px;padding:28px 24px 22px;display:flex;flex-direction:column;gap:18px;text-align:center}
.card h1{margin:0;font-family:var(--serif);font-weight:700;font-size:36px;letter-spacing:.18em;text-indent:.18em;color:var(--gold);text-wrap:balance}
.card p{margin:0;font-size:14px;line-height:1.7;color:rgba(241,232,214,.78)}
.name-box{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;display:flex;flex-direction:column;gap:6px;align-items:center}
.name-box small{font-size:11px;letter-spacing:.3em;color:rgba(241,232,214,.6)}
.name-box strong{font-family:var(--serif);font-size:42px;font-weight:700;color:var(--paper);letter-spacing:.08em}
.reroll{font-size:13px;color:var(--gold);text-decoration:underline;text-underline-offset:4px;padding:6px}
.card .big-btn{width:100%}

</style>

<div id="app">
  <canvas id="c" aria-label="三维礼堂场景，点击地面行走"></canvas>
  <div id="labels"></div>

  <header class="hud">
    <div class="pill glass">
      <div class="hall">清缘堂</div>
      <div class="count"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.4 3.4 0 0 1 0 6.4M18.2 14.8c1.8.8 3 2.6 3.3 5.2"/></svg><span id="cnt">1</span></div>
    </div>
    <div class="right">
      <div class="pill glass">
        <button class="icon-btn" id="soundBtn" aria-label="静音">
          <svg id="sndOn" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          <svg id="sndOff" viewBox="0 0 24 24" hidden><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
      </div>
      <button class="view glass" id="viewBtn">视角<b id="viewName">跟随</b></button>
    </div>
  </header>

  <div id="toast" class="glass"></div>

  <div class="actions"><button class="big-btn" id="kneelBtn" hidden>跪拜</button><button class="big-btn" id="incenseBtn" hidden>上香</button></div>

  <section id="muyuPanel" hidden>
    <div class="seg" role="tablist"><button id="tabMuyu" class="on" role="tab" aria-selected="true">木鱼</button><button id="tabBeads" role="tab" aria-selected="false">念珠</button></div>
    <svg id="muyu" viewBox="0 0 320 260" role="button" aria-label="敲木鱼">
      <defs>
        <radialGradient id="wood" cx="42%" cy="35%" r="75%">
          <stop offset="0" stop-color="#d98a4a"/><stop offset=".55" stop-color="#a24d22"/><stop offset="1" stop-color="#5a2410"/>
        </radialGradient>
        <linearGradient id="stick" x1="0" x2="1"><stop offset="0" stop-color="#9a6a3e"/><stop offset="1" stop-color="#6a4224"/></linearGradient>
      </defs>
      <ellipse cx="152" cy="240" rx="128" ry="16" fill="#2a1d14"/>
      <ellipse cx="152" cy="236" rx="118" ry="11" fill="#5a3f28"/>
      <g id="fishG">
        <path d="M40,180 C40,110 110,80 170,85 C235,90 270,135 265,180 C262,220 215,235 150,235 C85,235 40,220 40,180 Z" fill="url(#wood)"/>
        <path d="M126,104 q12,13 24,0 M150,100 q12,13 24,0 M174,100 q12,13 24,0 M198,104 q12,13 24,0 M138,122 q12,13 24,0 M162,120 q12,13 24,0 M186,122 q12,13 24,0" stroke="#3a160a" stroke-opacity=".45" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="90" cy="152" r="14" fill="none" stroke="#3a160a" stroke-width="4"/>
        <circle cx="90" cy="152" r="5" fill="#3a160a"/>
        <path d="M66,192 C120,214 200,214 252,186" stroke="#250c04" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path d="M70,186 C120,206 198,206 248,180" stroke="#e7a56c" stroke-opacity=".35" stroke-width="2" fill="none"/>
        <ellipse cx="132" cy="120" rx="52" ry="15" fill="#fff" fill-opacity=".14" transform="rotate(-8 132 120)"/>
      </g>
      <g id="mallet">
        <line x1="198" y1="64" x2="304" y2="12" stroke="url(#stick)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="188" cy="72" r="18" fill="#ead7b0"/>
        <circle cx="182" cy="66" r="6" fill="#fff" fill-opacity=".45"/>
      </g>
    </svg>
    <div id="beadsBox" hidden>
      <div class="bcount"><b id="beadN">0</b><span>/ 108</span><small id="beadRound">第 1 圈</small></div>
      <canvas id="beads" aria-label="念珠，上下滑动拨珠"></canvas>
    </div>
    <div class="under">
      <span class="hint" id="hint">轻点木鱼</span>
      <button class="ghost glass" id="standBtn">起身</button>
    </div>
  </section>

  <div id="intro">
    <div class="card glass">
      <h1>清缘堂</h1>
      <p>从台阶走进礼堂，选一个蒲团跪下，敲木鱼攒财富。</p>
      <div class="name-box">
        <small>今日法名</small>
        <strong id="introName">小禅</strong>
        <button class="reroll" id="rerollBtn">换一个</button>
      </div>
      <button class="big-btn" id="enterBtn">入堂</button>
    </div>
  </div>
</div>

<script src="assets/vendor/three.min.js"></script>
<script src="assets/vendor/GLTFLoader.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const CHARS = '禅安莲云竹松月溪禾柚橙茶墨栗桃岚念素澄悟净明慧果圆空灯檀';
const rnd = (a,b)=>a+Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function newName(exclude){ let n; do{ n='小'+pick(CHARS);}while(exclude && exclude.has(n)); return n; }

let myName = newName();
$('introName').textContent = myName;
$('rerollBtn').onclick = () => { myName = newName(new Set([myName])); $('introName').textContent = myName; if(player) player.label.innerHTML = '<i>我</i>'+myName; };


let toastT;
function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),ms); }

/* ---------- renderer ---------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc5d8dc);
scene.fog = new THREE.Fog(0xc5d8dc, 32, 68);
const camera = new THREE.PerspectiveCamera(55,1,0.1,120);
function resize(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.fov = w<h ? 64 : 50; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

/* ---------- helpers ---------- */
function canvasTex(w,h,draw,rx=1,ry=1){
  const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=4;
  if(rx!==1||ry!==1){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); }
  return t;
}
const std = (color,o={}) => new THREE.MeshStandardMaterial(Object.assign({color,roughness:.75,metalness:0},o));
function box(w,h,d,mat,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m); return m; }
function limb(parent,a,b,r,mat){
  const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b), len=A.distanceTo(B);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.05,len,14),mat);
  m.position.copy(A).add(B).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize());
  parent.add(m); return m;
}

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xe8f4ff,0x71806b,.82));
scene.add(new THREE.AmbientLight(0xdce8e1,.56));
const dir=new THREE.DirectionalLight(0xfff2d8,1.35); dir.position.set(-7,13,8); dir.castShadow=true;dir.shadow.mapSize.set(1024,1024);dir.shadow.camera.left=-22;dir.shadow.camera.right=22;dir.shadow.camera.top=22;dir.shadow.camera.bottom=-22;dir.shadow.camera.near=.5;dir.shadow.camera.far=48;dir.shadow.camera.updateProjectionMatrix();dir.shadow.bias=-.00035;dir.shadow.normalBias=.025;scene.add(dir);
const buddhaGlow=new THREE.PointLight(0xffd58c,.42,14,1.6); buddhaGlow.position.set(0,3.4,-8.4); scene.add(buddhaGlow);
const hallLights=[[-4,5,-3],[4,5,-3],[0,5,3]].map(p=>{const l=new THREE.PointLight(0xffd29a,.18,16,1.5); l.position.set(...p); scene.add(l); return l;});

/* ---------- textures ---------- */
const plankTex = canvasTex(1024,1024,(g,w,h)=>{
  g.fillStyle='#1b100c';g.fillRect(0,0,w,h);
  const cols=8,cw=w/cols,tones=['#382219','#2a1812','#41271b','#301b13','#3a2117','#28160f','#43271a','#321c13'];
  for(let i=0;i<cols;i++){
    const x=i*cw,gr=g.createLinearGradient(x,0,x+cw,0);gr.addColorStop(0,'#120b08');gr.addColorStop(.035,tones[i]);gr.addColorStop(.5,tones[i]);gr.addColorStop(.96,tones[i]);gr.addColorStop(1,'#160d09');g.fillStyle=gr;g.fillRect(x,0,cw,h);
    g.fillStyle='rgba(0,0,0,.38)';g.fillRect(x,0,3,h);g.fillRect(x+cw-3,0,3,h);
    for(let k=0;k<34;k++){const gx=x+8+Math.random()*(cw-16),alpha=.018+Math.random()*.035;g.strokeStyle=`rgba(205,151,99,${alpha})`;g.lineWidth=.7+Math.random()*1.2;g.beginPath();g.moveTo(gx,0);g.bezierCurveTo(gx+rnd(-8,8),h*.3,gx+rnd(-8,8),h*.7,gx+rnd(-5,5),h);g.stroke();}
    // Staggered end joints make the planks read as long, individually laid boards.
    const offset=i%2?170:0;for(let y=offset;y<h;y+=430){if(y>0){g.fillStyle='rgba(0,0,0,.65)';g.fillRect(x+3,y,cw-6,5);g.fillStyle='rgba(198,146,94,.1)';g.fillRect(x+4,y+5,cw-8,1);}}
  }
},2,2);
const woodTex = canvasTex(512,1024,(g,w,h)=>{
  g.fillStyle='#2b1912';g.fillRect(0,0,w,h);
  for(let i=0;i<4;i++){
    const x=i*w/4,cw=w/4,gr=g.createLinearGradient(x,0,x+cw,0);gr.addColorStop(0,'#1a100c');gr.addColorStop(.14,['#43291d','#382117','#4a2d1e','#341d14'][i]);gr.addColorStop(.8,['#352016','#482c1d','#321b13','#432719'][i]);gr.addColorStop(1,'#180e0a');g.fillStyle=gr;g.fillRect(x,0,cw,h);
    for(let k=0;k<35;k++){const gx=x+Math.random()*cw;g.strokeStyle=`rgba(190,139,88,${.015+Math.random()*.025})`;g.lineWidth=1;g.beginPath();g.moveTo(gx,0);g.bezierCurveTo(gx+rnd(-5,5),h*.35,gx+rnd(-4,4),h*.7,gx+rnd(-5,5),h);g.stroke();}
    g.fillStyle='rgba(0,0,0,.55)';g.fillRect(x,0,3,h);g.fillRect(x+cw-3,0,3,h);
  }
},1,1);
const stoneTex = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#3d3a34'; g.fillRect(0,0,w,h);
  for(let i=0;i<400;i++){ g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},${Math.random()<.5?0:255},.03)`; g.fillRect(Math.random()*w,Math.random()*h,3,3); }
  g.strokeStyle='rgba(0,0,0,.45)'; g.lineWidth=3; for(let i=0;i<=4;i++){ g.beginPath(); g.moveTo(i*64,0); g.lineTo(i*64,h); g.stroke(); g.beginPath(); g.moveTo(0,i*64); g.lineTo(w,i*64); g.stroke(); }
},16,10);
const muralTex = canvasTex(1024,512,(g,w,h)=>{
  const bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#1b120e');bg.addColorStop(.55,'#281911');bg.addColorStop(1,'#351e15');g.fillStyle=bg;g.fillRect(0,0,w,h);
  // Stained timber panels and a restrained hand-painted halo.
  for(let i=0;i<=8;i++){const x=i*w/8;g.fillStyle='rgba(0,0,0,.28)';g.fillRect(x-4,0,8,h);g.fillStyle='rgba(186,136,78,.09)';g.fillRect(x+4,0,2,h);}
  for(let y of [18,h-20]){g.fillStyle='rgba(0,0,0,.42)';g.fillRect(0,y,w,14);g.fillStyle='rgba(191,148,91,.16)';g.fillRect(0,y+14,w,2);}
  const cx=w/2,cy=h*.55;
  const halo=g.createRadialGradient(cx,cy,32,cx,cy,245);halo.addColorStop(0,'rgba(151,109,54,.14)');halo.addColorStop(.58,'rgba(125,89,46,.09)');halo.addColorStop(1,'rgba(42,27,18,0)');g.fillStyle=halo;g.fillRect(0,0,w,h);

function clampXZ(p){

$('viewBtn').onclick=()=>{ mode=(mode+1)%3; $('viewName').textContent=MODES[mode]; };
const camPos=new THREE.Vector3(0,4,13), camLook=new THREE.Vector3(0,1,4), tmp=new THREE.Vector3(), tmp2=new THREE.Vector3();
function updateCamera(dt){
  const p=player.root.position;
  camYaw += wrapA(camYawGoal-camYaw)*(1-Math.exp(-dt*5));
  if(mode===0){
    const s=Math.sin(camYaw),c=Math.cos(camYaw);
    tmp.set(p.x+s*3.4,p.y+2.0,p.z+c*3.4);
    tmp2.set(p.x-s*2,p.y+.5,p.z-c*2);
  } else if(mode===1){
    tmp.set(p.x*.4,15,p.z*.3+9); tmp2.set(p.x*.6,0,p.z*.6-2);
  } else {
    tmp.set(0,3.4,-8.6); tmp2.set(p.x,p.y+1,p.z);
  }
  const k=1-Math.exp(-dt*4);
  camPos.lerp(tmp,k); camLook.lerp(tmp2,k);
  camera.position.copy(camPos); camera.lookAt(camLook);
}

/* ---------- audio ---------- */
let ac=null, masterGain=null, muted=false, birdTimer=0, ambienceStarted=false;
const audioBus=()=>masterGain||ac.destination;
function birdNote(at,freq,peak,duration){
  const o=ac.createOscillator(),g=ac.createGain();o.type='sine';
  o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(freq*1.28,at+duration*.38);o.frequency.exponentialRampToValueAtTime(freq*.91,at+duration);
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(peak,at+.009);g.gain.exponentialRampToValueAtTime(.0001,at+duration);
  o.connect(g).connect(audioBus());o.start(at);o.stop(at+duration+.02);
}
function birdCall(){
  if(!ac||!ambienceStarted)return;
  const t=ac.currentTime+.03, notes=2+(Math.random()>.72?1:0), base=1500+Math.random()*500;
  for(let i=0;i<notes;i++)birdNote(t+i*(.14+Math.random()*.12),base*(.94+Math.random()*.12),.001+Math.random()*.0006,.14+Math.random()*.08);
  birdTimer=setTimeout(birdCall,4200+Math.random()*7600);
}
function startAmbience(){
  if(!ac||ambienceStarted)return;ambienceStarted=true;
  // Soft filtered cicada shimmer, gently pulsing instead of a loud continuous buzz.
  const length=ac.sampleRate*3|0,buffer=ac.createBuffer(1,length,ac.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=Math.random()*2-1;
  const noise=ac.createBufferSource();noise.buffer=buffer;noise.loop=true;
  const high=ac.createBiquadFilter();high.type='highpass';high.frequency.value=3200;
  const low=ac.createBiquadFilter();low.type='lowpass';low.frequency.value=6100;
  const level=ac.createGain();level.gain.value=.00035;
  const pulse=ac.createOscillator(),depth=ac.createGain();pulse.frequency.value=6.5;depth.gain.value=.0001;
  pulse.connect(depth).connect(level.gain);noise.connect(high).connect(low).connect(level).connect(audioBus());
  noise.start();pulse.start();birdTimer=setTimeout(birdCall,1600+Math.random()*2400);
}
function initAudio(){
  if(ac){ac.resume&&ac.resume();return;}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();masterGain=ac.createGain();masterGain.gain.value=muted?0:.8;masterGain.connect(ac.destination);ac.resume&&ac.resume();startAmbience();}catch(e){ac=null;masterGain=null;}
}
function knock(){
  if(!ac||muted) return;
  const t=ac.currentTime, out=ac.createGain(); out.gain.value=.9; out.connect(audioBus());
  const o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
  o.frequency.setValueAtTime(330,t); o.frequency.exponentialRampToValueAtTime(205,t+.12);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.9,t+.006); g.gain.exponentialRampToValueAtTime(.001,t+.28);
  o.connect(g).connect(out); o.start(t); o.stop(t+.3);
  const o2=ac.createOscillator(), g2=ac.createGain(); o2.type='sine'; o2.frequency.setValueAtTime(560,t); o2.frequency.exponentialRampToValueAtTime(430,t+.05);
  g2.gain.setValueAtTime(.22,t); g2.gain.exponentialRampToValueAtTime(.001,t+.09); o2.connect(g2).connect(out); o2.start(t); o2.stop(t+.1);
  const len=ac.sampleRate*.03|0, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const n=ac.createBufferSource(); n.buffer=buf; const bp=ac.createBiquadFilter(); bp.type='lowpass'; bp.frequency.value=700; bp.Q.value=.7;
  const ng=ac.createGain(); ng.gain.value=.35; n.connect(bp).connect(ng).connect(out); n.start(t);
}
function bell(){
  if(!ac||muted) return;
  const t=ac.currentTime, out=ac.createGain(); out.gain.value=.32; out.connect(audioBus());
  const f0=138;
  [[1,1,5],[1.004,.6,5],[2.0,.45,3.4],[2.76,.32,2.4],[4.07,.2,1.6],[5.4,.14,1.1],[8.9,.06,.5]].forEach(([r,a,d])=>{
    const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=f0*r;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(a,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(out); o.start(t); o.stop(t+d+.05);
  });
  const len=ac.sampleRate*.06|0, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const n=ac.createBufferSource(); n.buffer=buf; const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600;
  const ng=ac.createGain(); ng.gain.value=.6; n.connect(lp).connect(ng).connect(out); n.start(t);
}
let bellAcc=0;
function ringBell(){
  bell();
  if(player.kneeling) player.bow=1;
  for(const n of npcs) if(n.ch.kneeling) n.ch.bow=1;
}
$('soundBtn').onclick=()=>{ muted=!muted; $('sndOn').hidden=muted; $('sndOff').hidden=!muted; $('soundBtn').setAttribute('aria-label',muted?'开启声音':'静音'); if(masterGain&&ac)masterGain.gain.setTargetAtTime(muted?0:.8,ac.currentTime,.04); };

/* ---------- input ---------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let down=null;
canvas.addEventListener('pointerdown',e=>{ if(down) return; down={id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,drag:false}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{
  if(!down||e.pointerId!==down.id) return;
  if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>8) down.drag=true;
  if(down.drag && mode===0){ camYawGoal-= (e.clientX-down.lx)*.008; camYaw=camYawGoal; }
  down.lx=e.clientX;
});
const endPtr=e=>{ if(!down||e.pointerId!==down.id) return; const d=down; down=null; if(!d.drag && e.type==='pointerup') tap(e.clientX,e.clientY); };
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);

function tap(x,y){
  if(!entered) return;
  const r=canvas.getBoundingClientRect();
  ndc.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const censerHit=ray.intersectObjects([censerBody,censerRim],false)[0];
  if(censerHit){if(Math.hypot(player.root.position.x,player.root.position.z+7.55)<=2.45)beginIncenseOffering();else toast('走近供桌后即可上香');return;}
  const hc=ray.intersectObjects(cushionMeshes,false)[0];
  if(hc){
    player.pendingOffering=false;
    const idx=hc.object.userData.idx;
    if(player.kneeling && player.cushion===idx) return;
    if(occ.has(idx) && occ.get(idx)!=='me'){ toast('这个蒲团已经有人了，换一个吧'); return; }
    if(player.kneeling) stand();
    player.pendingCushion=idx; player.target={x:cushions[idx].x,z:cushions[idx].z};
    showMarker(cushions[idx].x,.17,cushions[idx].z); return;
  }
  const hf=ray.intersectObjects(walkables,false)[0];
  if(hf){
    player.pendingOffering=false;
    if(player.kneeling) stand();
    const t={x:hf.point.x,z:hf.point.z}; clampXZ(t);
    player.pendingCushion=-1; player.target=t; showMarker(t.x,groundY(t.z)+.02,t.z);
  }
}
let markerA=0;
function showMarker(x,y,z){ marker.position.set(x,y+.01,z); markerA=1; }

/* ---------- kneel & muyu ---------- */
let nearIdx=-1;
const incenseApproach={x:0,z:-7.55};
function beginIncenseOffering(){
  if(player.kneeling)stand();
  const dist=Math.hypot(player.root.position.x-incenseApproach.x,player.root.position.z-incenseApproach.z);
  if(dist>1.25){player.pendingOffering=true;player.pendingCushion=-1;player.target={x:incenseApproach.x,z:incenseApproach.z};showMarker(incenseApproach.x,.04,incenseApproach.z);return;}
  player.pendingOffering=false;player.faceYaw=Math.PI;player.offerTimer=player.offerDuration;
}
function completeIncenseOffering(){
  incenseLit=true;incenseAt=clock.elapsedTime;incenseEmberMat.emissive.setHex(0xff6c32);incenseEmberMat.emissiveIntensity=1.25;incenseGlow.intensity=.28;
  for(const puff of smokePuffs)puff.mesh.visible=true;
  toast('上香完成，愿心安宁');
}
$('incenseBtn').onclick=beginIncenseOffering;
function nearestCushion(){
  const p=player.root.position; let best=-1,bd=.6;
  for(let i=0;i<cushions.length;i++){ const d=Math.hypot(cushions[i].x-p.x,cushions[i].z-p.z); if(d<bd){bd=d;best=i;} }
  return best;
}
$('kneelBtn').onclick=()=>{
  if(nearIdx<0) return;
  if(occ.has(nearIdx)&&occ.get(nearIdx)!=='me'){ toast('这个蒲团已经有人了'); return; }
  occ.set(nearIdx,'me'); kneelOn(player,nearIdx); player.pendingCushion=-1;
  $('kneelBtn').hidden=true; $('muyuPanel').hidden=false; camYawGoal=0;
};
function stand(){ occ.delete(player.cushion); standUp(player); $('muyuPanel').hidden=true; }
$('standBtn').onclick=stand;

let hitAt=-1;
const fxEl=document.createElement('div'); fxEl.id='fx'; $('app').appendChild(fxEl);
const floats=[], fv=new THREE.Vector3();
function animFloats(now){
  if(!floats.length) return;
  fv.set(player.root.position.x,player.root.position.y+.84-player.kb*.1,player.root.position.z).project(camera);
  const x=(fv.x*.5+.5)*innerWidth, y=(-fv.y*.5+.5)*innerHeight-34;
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i], age=Math.max(0,(now-f.t0)/1000);
    if(age>1.2){ f.el.remove(); floats.splice(i,1); continue; }
    const op=age<.6?1:Math.max(0,1-(age-.6)/.6);
    f.el.style.opacity=op;
    f.el.style.transform=`translate(${x+f.dx}px,${y-age*70}px) translate(-50%,-100%)`;
  }
}
const fishG=$('fishG'), mallet=$('mallet'), panel=$('muyuPanel');
function strike(cx,cy){
  if(!player.kneeling || tool!=='muyu') return;
  knock(); hitAt=performance.now();
  const f=document.createElement('div'); f.className='float'; f.textContent='财富 +1';
  fxEl.appendChild(f); floats.push({el:f,t0:performance.now(),dx:rnd(-18,18)}); animFloats(performance.now());
}
$('muyu').addEventListener('pointerdown',e=>{ e.preventDefault(); strike(e.clientX,e.clientY); });
addEventListener('keydown',e=>{ if((e.code==='Space'||e.code==='Enter') && !$('muyuPanel').hidden && document.activeElement.tagName!=='BUTTON'){ e.preventDefault(); strike(); } });
function animMuyu(now){
  let h=0; if(hitAt>0){ const e=(now-hitAt)/1000; h = e<.06 ? e/.06 : Math.max(0,1-(e-.06)/.2); if(e>.3) hitAt=-1; }
  mallet.setAttribute('transform',`rotate(${24*(1-h)} 304 12)`);
  const sq=h>.7?(h-.7)/.3:0;
  fishG.setAttribute('transform',`translate(152 235) scale(${1+sq*.03} ${1-sq*.035}) translate(-152 -235)`);
}

/* ---------- prayer beads ---------- */
let tool='muyu';
function setTool(t){
  tool=t;
  for(const [id,k] of [['tabMuyu','muyu'],['tabBeads','beads']]){ $(id).classList.toggle('on',t===k); $(id).setAttribute('aria-selected',t===k); }
  $('muyu').hidden=t!=='muyu'; $('beadsBox').hidden=t!=='beads';
  $('hint').textContent=t==='muyu'?'轻点木鱼':'上下滑动拨珠';
}
$('tabMuyu').onclick=()=>setTool('muyu'); $('tabBeads').onclick=()=>setTool('beads');
function beadSprite(seed){
  const S=128,c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  let r=seed*7919; const R=()=>{ r=(r*9301+49297)%233280; return r/233280; };
  g.save(); g.beginPath(); g.arc(64,64,62,0,7); g.clip();
  const gr=g.createRadialGradient(46,40,4,64,64,66); gr.addColorStop(0,'#f8d3a2'); gr.addColorStop(.35,'#eaa45e'); gr.addColorStop(.8,'#c86f30'); gr.addColorStop(1,'#8a4519');
  g.fillStyle=gr; g.fillRect(0,0,S,S);
  for(let k=0;k<30;k++){ const x0=R()*128, bend=(x0-64)*.4;
    g.strokeStyle=R()<.55?`rgba(125,58,18,${.12+R()*.18})`:`rgba(255,228,185,${.1+R()*.15})`; g.lineWidth=.6+R()*1.6;
    g.beginPath(); g.moveTo(x0,0); g.quadraticCurveTo(x0+bend,64,x0,128); g.stroke(); }
  const sp=g.createRadialGradient(44,36,0,44,36,28); sp.addColorStop(0,'rgba(255,255,255,.8)'); sp.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=sp; g.fillRect(0,0,S,S);
  const rim=g.createRadialGradient(64,64,38,64,64,64); rim.addColorStop(0,'rgba(0,0,0,0)'); rim.addColorStop(1,'rgba(60,20,0,.4)'); g.fillStyle=rim; g.fillRect(0,0,S,S);
  g.restore(); return c;
}
const sprites=[1,2,3,4].map(beadSprite);
const bc=$('beads'), bctx=bc.getContext('2d');
const NB=24; let bOff=0,bVel=0,bDrag=null,bLast=0,beadCount=0;
function beadGeom(){ const w=bc.clientWidth,h=bc.clientHeight; const R=Math.min(w*.3,h*.17), pad=R*.6, L=Math.max(10,h-2*pad-2*R), P=2*L+2*Math.PI*R; return {w,h,R,L,P,cx:w*.5,top:pad+R,sp:P/NB}; }
function pathAt(u,G){ u=((u%G.P)+G.P)%G.P; const {R,L,cx,top}=G;
  if(u<L) return [cx+R,top+u]; u-=L;
  if(u<Math.PI*R){ const a=u/R; return [cx+R*Math.cos(a),top+L+R*Math.sin(a)]; } u-=Math.PI*R;
  if(u<L) return [cx-R,top+L-u]; u-=L;
  const a=Math.PI+u/R; return [cx+R*Math.cos(a),top+R*Math.sin(a)]; }
function showBeads(){ const n=beadCount; $('beadN').textContent=n?((n-1)%108)+1:0; $('beadRound').textContent='第 '+(n?Math.floor((n-1)/108)+1:1)+' 圈'; if(n&&n%108===0) toast('圆满一圈',1600); }
function tick(){
  if(!ac||muted) return;
  const t=ac.currentTime, out=ac.createGain(); out.gain.value=.14;
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400; out.connect(lp).connect(audioBus());
  const hit=(dt,amp)=>{
    const s=t+dt, base=760+Math.random()*180;
    // a few short, inharmonic modes: how a small piece of hard wood rings when struck
    [[1,1,.04],[2.42,.4,.022],[3.9,.18,.013],[5.7,.08,.008]].forEach(([r,a,d])=>{
      const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=base*r*(1+(Math.random()-.5)*.04);
      g.gain.setValueAtTime(.0001,s); g.gain.linearRampToValueAtTime(a*amp,s+.0015); g.gain.exponentialRampToValueAtTime(.0001,s+d);
      o.connect(g).connect(out); o.start(s); o.stop(s+d+.01);
    });
    const len=ac.sampleRate*.006|0, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const n=ac.createBufferSource(); n.buffer=buf; const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=.8;
    const ng=ac.createGain(); ng.gain.value=.45*amp; n.connect(bp).connect(ng).connect(out); n.start(s);
  };
  const a=.8+Math.random()*.25;
  hit(0,a); hit(.016+Math.random()*.012,a*.3);
}
bc.addEventListener('pointerdown',e=>{ bDrag={y:e.clientY,t:performance.now()}; bVel=0; bc.setPointerCapture(e.pointerId); e.preventDefault(); });
bc.addEventListener('pointermove',e=>{ if(!bDrag) return; const now=performance.now(), dy=e.clientY-bDrag.y; bOff+=dy; bVel=dy/Math.max(8,now-bDrag.t)*1000; bDrag.y=e.clientY; bDrag.t=now; });
const bEnd=()=>{ if(bDrag && performance.now()-bDrag.t>80) bVel=0; bDrag=null; };
bc.addEventListener('pointerup',bEnd); bc.addEventListener('pointercancel',bEnd);
function updateBeads(dt){
  if($('muyuPanel').hidden || tool!=='beads') return;
  const G=beadGeom(); if(!G.w||!G.h) return;
  const dpr=Math.min(devicePixelRatio,2);
  if(bc.width!==Math.round(G.w*dpr)||bc.height!==Math.round(G.h*dpr)){ bc.width=Math.round(G.w*dpr); bc.height=Math.round(G.h*dpr); }
  if(!bDrag){ bOff+=bVel*dt; bVel*=Math.exp(-dt*2.5); if(Math.abs(bVel)<60){ bVel*=.85; const tg=Math.round(bOff/G.sp)*G.sp; bOff+=(tg-bOff)*Math.min(1,dt*10); } }
  const idx=Math.round(bOff/G.sp);
  if(idx>bLast){ beadCount+=idx-bLast; tick(); showBeads(); }
  bLast=idx;
  const g=bctx; g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,G.w,G.h);
  g.strokeStyle='rgba(217,180,108,.7)'; g.lineWidth=1.4; g.beginPath();
  for(let u=0;u<=G.P;u+=4){ const [x,y]=pathAt(u,G); u?g.lineTo(x,y):g.moveTo(x,y); } g.closePath(); g.stroke();
  const list=[];
  for(let i=0;i<NB;i++){ const [x,y]=pathAt(i*G.sp+bOff,G); list.push({x,y,i}); }
  list.sort((a,b)=>a.x-b.x);
  for(const b of list){ const s=.72+.28*((b.x-G.cx)/G.R+1)/2, r=G.sp*.56*s;
    g.globalAlpha=1; g.drawImage(sprites[b.i%4],b.x-r,b.y-r,r*2,r*2); }
}

/* ---------- enter ---------- */
let entered=false;
$('enterBtn').onclick=()=>{
  entered=true; $('intro').hidden=true;
  initAudio();
  toast('点地面行走 · 点蒲团走过去 · 拖动转视角',4200);
};

/* ---------- loop ---------- */
const clock=new THREE.Clock(); const pv=new THREE.Vector3();
function placeLabel(el,ch){
  pv.set(ch.root.position.x,ch.root.position.y+.84-ch.kb*.1,ch.root.position.z).project(camera);
  if(pv.z>1||pv.z<-1){ el.style.display='none'; return; }
  el.style.display='';
  el.style.transform=`translate(${(pv.x*.5+.5)*innerWidth}px,${(-pv.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`;
}
function frame(now){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  for(const n of npcs){ npcThink(n,dt); updateMonk(n.ch,dt); }
  const wasOffering=player.offerTimer>0;
  updateMonk(player,dt);
  if(player.pendingOffering&&!player.walking&&!player.target){player.pendingOffering=false;player.faceYaw=Math.PI;player.offerTimer=player.offerDuration;}
  if(wasOffering&&player.offerTimer<=0)completeIncenseOffering();
  // kneel prompt
  if(!player.kneeling && !player.walking){ nearIdx=nearestCushion(); }
  else if(!player.kneeling) nearIdx=-1;
  $('kneelBtn').hidden = !(entered && !player.kneeling && nearIdx>=0);
  const nearIncense=Math.hypot(player.root.position.x-incenseApproach.x,player.root.position.z-incenseApproach.z)<2.45;
  $('incenseBtn').hidden=!(entered&&nearIncense&&!player.kneeling&&!player.walking&&player.offerTimer<=0);
  // marker
  if(markerA>0){ markerA=player.target?1:Math.max(0,markerA-dt*2.5); marker.material.opacity=markerA*.9; const s=1+Math.sin(t*6)*.08; marker.scale.set(s,s,s); }
  // flicker
  for(const c of candleLights){ const f=.85+Math.sin(t*9+c.seed)*.08+Math.sin(t*23+c.seed*3)*.05; c.l.intensity=1.1*f; c.f.scale.y=f; }
  buddhaGlow.intensity=1.5+Math.sin(t*.8)*.12;
  incenseGlow.intensity=incenseLit ? .24+Math.sin((t-incenseAt)*2)*.025 : 0;
  for(const p of smokePuffs){const f=((t*.24+p.phase)%1+1)%1;p.mesh.visible=incenseLit;p.mesh.position.set(p.x+Math.sin(t*1.25+p.phase*8)*.025,1.64+f*.78,-9.2);p.mesh.scale.setScalar(.055+f*.095);p.mesh.material.opacity=incenseLit ? .17*Math.sin(f*Math.PI) : 0;}
  halo.rotation.z=t*.05;
  updateCamera(dt);
  renderer.render(scene,camera);
  placeLabel(player.label,player);
  for(const n of npcs) placeLabel(n.label,n.ch);
  animMuyu(now);
  animFloats(now);
  updateBeads(dt);
  if(entered){ bellAcc+=dt; if(bellAcc>=6){ bellAcc-=6; ringBell(); } }
  requestAnimationFrame(frame);
}
camPos.set(0,3,13);
requestAnimationFrame(frame);
})();
